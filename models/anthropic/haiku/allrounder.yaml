format: neno/model/v1
metadata:
  id: anthropic/haiku/allrounder
spec:
  adapter:
    format: neno/anthropic/v1
    endpoint: https://api.anthropic.com/v1/messages
    version: 2023-06-01
    allow-loopback-http: false
  provider: anthropic
  model: claude-haiku-4-5-20251001
  authentication:
    scheme: x-api-key
    credential-slot: anthropic
  parameters:
    temperature: 0.5
    service_tier: standard_only
  limits:
    input-tokens: 200000
    output-tokens: 64000
    minimum-output-tokens: 16
  accounting:
    id: anthropic.messages.claude-haiku-4-5-20251001.v1
    revision: 2026-09-27
  capabilities:
    tools: true
    sampling: true
    effort: false
