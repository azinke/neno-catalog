format: neno/model/v1
metadata:
  id: openai/luna/sprinter
spec:
  adapter:
    format: neno/openai/v1
    endpoint: https://api.openai.com/v1/responses
    api: responses
    output-token-parameter: max_output_tokens
    allow-loopback-http: false
  provider: openai
  model: gpt-6-luna
  authentication:
    scheme: bearer
    credential-slot: openai
  parameters:
    reasoning:
      effort: low
    service_tier: default
  limits:
    input-tokens: 1050000
    output-tokens: 128000
    minimum-output-tokens: 16
  accounting:
    id: openai.responses.gpt-6-luna.v1
    revision: 2026-10-04
  capabilities:
    reasoning: true
    output-format: json-schema-strict
    tools: true
